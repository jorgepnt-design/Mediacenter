# Deployment auf Render: statische Web-App + optionale ffmpeg-API.
services:
  - type: web
    name: mediacenter
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: require-corp
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Optional – nur nötig für sehr große Dateien oder schnelles AV1.
  - type: web
    name: mediacenter-api
    runtime: docker
    plan: standard
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_ORIGIN
        sync: false
      - key: MAX_UPLOAD_BYTES
        value: "8589934592"
